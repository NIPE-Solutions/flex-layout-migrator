name: Bug report
description: Report an incorrect conversion, crash, or diagnostic.
title: 'fix: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets or confidential project code. Reduce source to the smallest redacted reproduction.
        Report security issues through [GitHub private vulnerability reporting](https://github.com/NIPE-Solutions/flex-layout-migrator/security/advisories/new), not a public issue.
  - type: input
    id: version
    attributes:
      label: Codemod version
      placeholder: Output of npx flex-layout-codemod --version
    validations: { required: true }
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: Output of node --version
    validations: { required: true }
  - type: input
    id: angular-version
    attributes:
      label: Angular version
      placeholder: Relevant @angular/core and @angular/compiler versions
    validations: { required: true }
  - type: dropdown
    id: target
    attributes:
      label: Target
      options: [Tailwind CSS, Native CSS, Plan or reporting]
    validations: { required: true }
  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: Remove private paths, tokens, and environment values.
      render: shell
    validations: { required: true }
  - type: textarea
    id: source
    attributes:
      label: Minimal redacted source template
      description: Include only the Angular template needed to reproduce the behavior.
      render: html
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics or JSON report excerpt
      description: Include diagnostic codes and source offsets when available; remove project paths and private source.
      render: text
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual result }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected result }
    validations: { required: true }
