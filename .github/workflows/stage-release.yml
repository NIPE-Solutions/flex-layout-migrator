name: Stage npm release
on:
  workflow_dispatch:
concurrency:
  group: npm-stage
  cancel-in-progress: false
jobs:
  stage:
    name: stage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: git fetch --no-tags origin 41c0714bca3ec09470e25efde0f30b6bc96cc0ac 92f720211a04563bd4216b90e52b9a7a230c048b
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: node scripts/release-artifact.mjs --verify-current-main
      - id: release
        run: npm run release:prepare -- --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release
          path: |
            ${{ steps.release.outputs.tarball }}
            release-artifact.json
          if-no-files-found: error
      - run: npm run release:verify
      - run: node scripts/release-artifact.mjs --verify-current-main
      - name: Stage ${{ steps.release.outputs.name }}@${{ steps.release.outputs.version }} (${{ steps.release.outputs.integrity }})
        run: npm stage publish "./${{ steps.release.outputs.tarball }}" --access public --tag latest
